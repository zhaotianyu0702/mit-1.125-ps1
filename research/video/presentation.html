<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Five-minute presentation · AI Career Compass</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f3;color:#172c37;font:16px/1.5 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px 24px 40px}a{color:#176d61;text-underline-offset:3px}a:focus-visible{outline:3px solid #176d61;outline-offset:4px}h1{font-size:clamp(1.6rem,4vw,2rem);margin:26px 0 6px}.meta{color:#52635e;font-size:14px;margin:0 0 20px}.player{position:relative}video{display:block;width:100%;aspect-ratio:16/9;background:#172c37;border-radius:8px}video::cue{font-size:clamp(12px,1.4vw,22px);color:white;background:rgba(0,0,0,.85);font-family:system-ui,sans-serif}.status{position:absolute;inset:0;display:grid;place-content:center;padding:24px;color:white;pointer-events:none;text-align:center}.status[hidden]{display:none}.download{display:inline-block;margin-top:16px;font-size:14px}@media(max-width:600px){main{padding:22px 16px}}
</style>
</head>
<body>
<main>
<a href="./submission.html">← Submission materials</a>
<h1>AI Career Compass</h1>
<p class="meta">Five-minute website demonstration · English narration & captions</p>
<div class="player">
<video controls playsinline preload="none" aria-label="Five-minute demonstration of AI Career Compass" src="./downloads/presentation.mp4?v=2">
<track kind="captions" src="./downloads/presentation.vtt?v=2" srclang="en" label="English" default>
Your browser cannot play this video. <a href="./downloads/presentation.mp4?v=2">Download the MP4</a>.
</video>
<p class="status" role="status" aria-live="polite" hidden>Loading video…</p>
</div>
<a class="download" href="./downloads/presentation.mp4?v=2" download="AI-Career-Compass.mp4">Download video (MP4)</a>
</main>
<script>
(async () => {
  const video = document.querySelector('video');
  const status = document.querySelector('.status');
  const source = video.getAttribute('src');
  // Static hosting does not honor byte ranges. A local Blob gives the native
  // player a complete seekable resource, including on mobile browsers.
  if (location.protocol === 'file:') return;
  video.removeAttribute('src');
  video.load();
  status.hidden = false;
  try {
    const response = await fetch(source);
    if (!response.ok) throw new Error('Video download failed');
    const blob = await response.blob();
    if (!blob.size) throw new Error('Empty video');
    const url = URL.createObjectURL(blob);
    video.addEventListener('loadedmetadata', () => { status.hidden = true; }, {once:true});
    video.addEventListener('error', () => {
      status.textContent = 'Unable to play here. Download the MP4 below.';
      status.hidden = false;
    }, {once:true});
    video.src = url;
    video.preload = 'auto';
    video.load();
    // Keep the Blob alive across back/forward cache restores.
    addEventListener('pagehide', event => { if (!event.persisted) URL.revokeObjectURL(url); });
  } catch {
    status.hidden = true;
    video.src = source;
    video.preload = 'metadata';
    video.load();
  }
})();
</script>
</body>
</html>
